name: Testes e versão web

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSAO: 4.7.2

jobs:
  cenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSAO}-stable/Godot_v${GODOT_VERSAO}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v*_linux.x86_64 godot && chmod +x godot
          ./godot --version

      - name: Importar projeto e checar scripts
        run: |
          ./godot --headless --path . --import 2>&1 | tee importacao.txt || true
          if grep -q "SCRIPT ERROR\|Parse Error" importacao.txt; then echo "Erro de script na importação"; exit 1; fi

      - name: Rodar os quatro cenários
        run: |
          set -o pipefail
          ./godot --headless --path . -s res://testes/executar_cenarios.gd 2>&1 | tee saida.txt
          if grep -q "SCRIPT ERROR" saida.txt; then echo "Erro de script"; exit 1; fi
          grep -q "TODOS OS CENÁRIOS PASSARAM" saida.txt

      - name: Capturas e testes de tela (toques e arraste reais)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          xvfb-run -a -s "-screen 0 1280x720x24" ./godot --path . --rendering-driver opengl3 --resolution 1280x720 -s res://testes/captura.gd 2>&1 | tee captura.txt
          if grep -q "SCRIPT ERROR" captura.txt; then echo "Erro de script na mesa"; exit 1; fi
          ls capturas
          for f in capturas/miniaturas/*.png; do echo "IMG_INICIO $f"; base64 -w0 "$f"; echo; echo "IMG_FIM"; done

      - uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: capturas/*.png

  web:
    needs: cenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar Godot e o modelo de exportação web
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSAO}-stable/Godot_v${GODOT_VERSAO}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v*_linux.x86_64 godot && chmod +x godot
          curl -fsSL -o modelos.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSAO}-stable/Godot_v${GODOT_VERSAO}-stable_export_templates.tpz"
          unzip -q modelos.tpz "templates/web_nothreads_release.zip" "templates/version.txt"
          destino="$HOME/.local/share/godot/export_templates/${GODOT_VERSAO}.stable"
          mkdir -p "$destino" && mv templates/* "$destino/"
          ls "$destino"

      - name: Exportar para a web
        run: |
          ./godot --headless --path . --import > /dev/null 2>&1 || true
          mkdir -p build/web
          ./godot --headless --path . --export-release "Web" build/web/index.html 2>&1 | tail -20
          ls -la build/web
          test -f build/web/index.pck

      - name: Baixar as capturas desta versão
        uses: actions/download-artifact@v4
        with:
          name: capturas
          path: build/web/capturas

      - name: Página de capturas
        run: |
          cd build/web/capturas
          {
            echo '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'
            echo '<title>Madly Knights — capturas</title><style>body{background:#151815;color:#eee;font-family:sans-serif;margin:16px}img{width:100%;max-width:960px;border:2px solid #c9a24a;border-radius:8px}figure{margin:0 0 28px}a{color:#f5c84c}</style></head><body>'
            echo "<h1>Madly Knights — capturas</h1><p>Versão ${GITHUB_SHA::7}, gerada em $(date -u '+%d/%m/%Y %H:%M') UTC. <a href=\"../\">Jogar</a></p>"
            for f in $(ls *.png | sort -V); do echo "<figure><img src=\"$f\" loading=\"lazy\"><figcaption>${f%.png}</figcaption></figure>"; done
            echo '</body></html>'
          } > index.html
          ls

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  publicar:
    needs: web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
